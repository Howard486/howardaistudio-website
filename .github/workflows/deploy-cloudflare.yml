name: Deploy Howard AI Studio Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: howardaistudio-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Office syntax and meeting controls
        run: |
          node --check office/app.js
          node --test office/meeting-controls.test.mjs
      - name: Publish scope
        run: echo "Deploying to the configured Cloudflare account. Workers.dev will be public unless Cloudflare Access protects it."
      - name: Prepare static asset directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cloudflare-dist
          cp ./*.html ./style.css ./_headers ./_redirects ./robots.txt .cloudflare-dist/
          cp -R office .cloudflare-dist/office
          cat > wrangler.production.jsonc <<'JSON'
          {
            "name": "howardaistudio-website",
            "workers_dev": true,
            "compatibility_date": "2026-04-26",
            "assets": {"directory": ".cloudflare-dist"}
          }
          JSON
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.143.0'
          command: deploy --config wrangler.production.jsonc
